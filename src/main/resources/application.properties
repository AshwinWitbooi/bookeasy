spring.application.name=bookeasy
spring.profiles.default=dev
server.servlet.context-path=/${spring.application.name}
info.app.name=${spring.application.name}

management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers,threaddump
management.info.env.enabled=true
management.info.git.mode=simple

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.datasource.url=jdbc:h2:mem:bookeasy;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
